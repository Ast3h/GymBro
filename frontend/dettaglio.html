<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBro - Dettaglio Scheda</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon/Favicon32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="stili.css">
    <script src="funzioni.js" defer></script>

    <style>
        .page-content { max-width: 700px; 
        margin: 0 auto;
        }

        /*  HERO  */
        .scheda-hero {
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .scheda-hero-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 5px;
        }

        .scheda-hero-meta {
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .scheda-hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 14px;
        }

        .scheda-note-label {
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .scheda-note {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.6;
            padding-top: 12px;
            border-top: 0.5px solid var(--border);
        }

        .scheda-note.vuota {
            font-style: italic;
            color: var(--border);
        }

        /*  PULSANTE AVVIA  */
        .start-btn {
            width: 100%;
            padding: 12px 0;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.18s;
        }

        .start-btn:hover { opacity: 0.88; }

        /*  LISTA ESERCIZI  */
        .ez-list { display: flex; flex-direction: column; gap: 8px; }

        .ez-item {
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: border-color 0.18s;
            cursor: pointer;
        }

        .ez-item:hover { border-color: var(--accent); }

        .ez-num {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent);
            width: 20px;
            flex-shrink: 0;
        }

        .ez-info { flex: 1; min-width: 0; }

        .ez-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ez-zona {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 3px;
        }

        .ez-badges { display: flex; gap: 5px; flex-shrink: 0; }

        .ez-badge {
            font-size: 0.65rem;
            padding: 3px 9px;
            border-radius: 4px;
            background: var(--surface2);
            border: 0.5px solid var(--border);
            color: var(--muted);
            white-space: nowrap;
        }

        .ez-badge.accent {
            background: var(--accent-dim);
            border-color: var(--accent-dim);
            color: var(--accent);
        }

        .ez-video-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--surface2);
            border: 0.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s;
            text-decoration: none;
        }

        .ez-video-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .ez-remove-btn {
            font-size: 0.75rem;
            color: var(--muted);
            background: none;
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 3px 8px;
            cursor: pointer;
            transition: color 0.18s, border-color 0.18s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ez-remove-btn:hover { color: #e24b4a; border-color: #e24b4a; }

        .ez-empty {
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
            padding: 24px;
            border: 0.5px dashed var(--border);
            border-radius: var(--radius);
        }

        /*  AZIONI HEADER  */
        .scheda-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .back-link {
            font-size: 0.72rem;
            color: var(--muted);
            text-decoration: none;
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 5px 12px;
            transition: color 0.18s, border-color 0.18s;
        }

        .back-link:hover { color: var(--text); border-color: var(--text); }

        .scheda-azioni { margin-left: auto; display: flex; gap: 8px; }

        .btn-elimina {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #e24b4a;
            border: 0.5px solid rgba(226,75,74,0.3);
            border-radius: var(--radius);
            padding: 5px 12px;
            background: none;
            cursor: pointer;
            transition: background 0.18s;
        }

        .btn-elimina:hover { background: rgba(226,75,74,0.08); }

        /* skeleton loading */
        .skeleton {
            background: var(--surface2);
            border-radius: 4px;
            animation: pulse 1.4s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        @media (max-width: 600px) {
            .ez-badges { display: none; }
        }

        /*  MODALE: visibile solo quando overlay ha classe .open  */
        .modal-overlay.open .modal { display: flex; }

        /*  MOBILE: modali si aprono come bottom sheet dal basso  */
        @media (max-width: 600px) {
            #modal-modifica,
            #modal-aggiungi-ez {
                align-items: flex-end;
                padding: 0;
            }

            #modal-modifica .modal,
            #modal-aggiungi-ez .modal {
                max-width: 100% !important;
                max-height: 90vh !important;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                margin-top: auto;
            }
        }

        /*  STEPPER SERIE/REPS no input  */
        .ez-stepper {
            display: flex;
            align-items: center;
            border: 0.5px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            background: var(--bg);
            flex-shrink: 0;
        }

        .ez-stepper button {
            width: 26px;
            height: 26px;
            background: var(--surface2);
            border: none;
            color: var(--text);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

        .ez-stepper button:hover  { background: var(--accent-dim); color: var(--accent); }
        .ez-stepper button:active { background: var(--accent); color: #fff; }

        .ez-stepper span {
            min-width: 26px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text);
            font-family: var(--font-body);
            user-select: none;
        }

        /*  PULSANTE AGGIUNGI ESERCIZIO (dentro modale modifica)  */
        .btn-aggiungi-ez {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 0.5px dashed var(--border);
            background: none;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: border-color 0.18s, color 0.18s;
        }
        .btn-aggiungi-ez:hover { border-color: var(--accent); color: var(--accent); }

        /*  BOTTOM SHEET: filtri gruppi muscolari  */
        .sheet-cats {
            display: flex;
            gap: 6px;
            padding: 10px 20px;
            overflow-x: auto;
            border-bottom: 0.5px solid var(--border);
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .sheet-cats::-webkit-scrollbar { display: none; }

        .sheet-cat {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            padding: 4px 12px;
            border-radius: 20px;
            border: 0.5px solid var(--border);
            background: none;
            color: var(--muted);
            white-space: nowrap;
            cursor: pointer;
            font-family: var(--font-body);
            transition: all 0.18s;
        }
        .sheet-cat.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /*  BOTTOM SHEET: lista risultati  */
        .sheet-ez-list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex: 1;
        }

        .sheet-ez-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            border-bottom: 0.5px solid var(--border);
            transition: background 0.15s;
        }
        .sheet-ez-item:last-child { border-bottom: none; }

        .sheet-ez-info { flex: 1; min-width: 0; }

        .sheet-ez-nm {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sheet-ez-zone {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .sheet-add-btn {
            font-size: 0.68rem;
            color: var(--accent);
            border: 0.5px solid var(--accent-dim);
            border-radius: 4px;
            padding: 4px 10px;
            background: none;
            cursor: pointer;
            font-family: var(--font-body);
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .sheet-add-btn:hover { background: var(--accent-dim); }
        .sheet-add-btn.aggiunto {
            color: var(--muted);
            border-color: var(--border);
            cursor: default;
        }

        .sheet-empty {
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
            padding: 32px 20px;
        }
    </style>
</head>

                    <div style="display:flex; gap:5px; margin-bottom:14px;">
                        <div class="skeleton" style="height:20px; width:60px; border-radius:20px;"></div>
                        <div class="skeleton" style="height:20px; width:60px; border-radius:20px;"></div>

                    <div class="ez-item" style="cursor:default;">

    <!--  MODALE MODIFICA SCHEDA  -->
    <div class="modal-overlay" id="modal-modifica">
        <div class="modal" style="max-width:520px; max-height:85vh; flex-direction:column;">
            <div class="modal-header" style="flex-shrink:0;">
                <div>
                    <div class="modal-title">Modifica scheda</div>
                    <div class="modal-sub">Modifica nome, note ed esercizi</div>
                </div>
                <button class="modal-close" onclick="chiudiModaleModifica()">✕</button>

    <!--  BOTTOM SHEET: SELEZIONE ESERCIZI  -->

            <!-- search -->

    <!--  MODALE VIDEO  -->

        <div class="modal" style="max-width:640px; flex-direction:column;">
            <div class="modal-header" style="flex-shrink:0;">
                <div class="modal-title">Video esercizio</div>
                <button class="modal-close" onclick="chiudiVideo()">✕</button>
            </div>

            <video id="video-player" controls style="width:100%; border-radius:var(--radius); background:#000;"></video>            </div>
        </div>

    <script>
        const TOKEN = () => localStorage.getItem('gymbros-token');
        const API   = 'http://localhost:3000';

        const params   = new URLSearchParams(window.location.search);
        const schedaId = parseInt(params.get('id'));
        const tipo = params.get('tipo');

        let _scheda = null;

        /*  CARICA SCHEDA  */
        async function caricaScheda() {
            if (!schedaId) {
                window.location.href = 'schede.html';
                return;
            }else if(tipo === 'Personale'){
                try {
                const res = await fetch(`${API}/users/workout-plans/${schedaId}`, {
                    method : 'GET',
                    headers: { 'Authorization' : 'Bearer ' + TOKEN() }
                });

                if (!res.ok) {
                    window.location.href = 'schede.html';
                    return;
                }

                _scheda = await res.json();
                
                renderScheda();

                } catch (e) {
                    console.error('Errore caricamento scheda:', e);
                }
            }else if(tipo === 'predefinita'){
                try {
                const res = await fetch(`${API}/users/workout-template/${schedaId}`, {
                    method : 'GET',
                    headers: { 'Authorization' : 'Bearer ' + TOKEN() }
                });

                if (!res.ok) {
                    window.location.href = 'schede.html';
                    return;
                }

                _scheda = await res.json();
                console.log(_scheda)
                renderScheda();

                } catch (e) {
                    console.error('Errore caricamento scheda:', e);
                }
            }

            
        }

        /*  RENDER  */
        function renderScheda() {
            if (!_scheda) return;

            document.title = 'GymBro - ' + _scheda.name;

            const zone = [...new Set(
                (_scheda.workout_ex || []).map(ex => ex.exercise?.macroPart).filter(Boolean)
            )];

            const tags = [
                `<span class="tag accent">${_scheda.tipo || 'Personale'}</span>`,
                ...zone.map(z => `<span class="tag accent">${z.charAt(0).toUpperCase() + z.slice(1)}</span>`)
            ].join('');

            const data = _scheda.dataCreazione
                ? new Date(_scheda.dataCreazione).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' })
                : '—';

            const nEx = (_scheda.workout_ex || []).length;
            if(_scheda.tipo === 'predefinita'){
                const azioni = document.getElementById('scheda-azioni');
                const btn    = document.getElementById('start-btn');
                if (azioni) azioni.style.display = 'none';
                if (btn)    btn.style.display    = 'none';
            } else {
                const btnPred = document.getElementById('start-btn-predefinito');
                if (btnPred) btnPred.style.display = 'none';
            }

            document.getElementById('scheda-hero').innerHTML = `
                <div class="scheda-hero-name">${_scheda.name}</div>
                <div class="scheda-hero-meta">${nEx} esercizi · creata il ${data}</div>
                <div class="scheda-hero-tags">${tags}</div>
                <div class="scheda-note-label">Note</div>
                <div class="scheda-note ${_scheda.note ? '' : 'vuota'}">
                    ${_scheda.note || 'Nessuna nota'}
                </div>`;

            const lista = document.getElementById('ez-list');
            lista.innerHTML = '';

            if (nEx === 0) {
                lista.innerHTML = '<div class="ez-empty">Nessun esercizio in questa scheda. Vai su Esercizi per aggiungerne.</div>';
                return;
            }

            _scheda.workout_ex.forEach((ex, i) => {
                const nome  = ex.exercise?.nameIt || ex.exercise?.name || 'Esercizio';
                const zona  = [ex.exercise?.macroPart, ex.exercise?.bodyPart].filter(Boolean).join(' · ');
                const video = ex.exercise?.videoUrl;
                const num   = String(i + 1).padStart(2, '0');

                const item = document.createElement('div');
                item.className = 'ez-item';
                item.innerHTML = `
                    <div class="ez-num">${num}</div>
                    <div class="ez-info">
                        <div class="ez-name">${nome}</div>
                        <div class="ez-zona">${zona}</div>
                    </div>
                    <div class="ez-badges">
                        <span class="ez-badge accent">${ex.nSet} serie</span>
                        ${ex.nRep ? `<span class="ez-badge">${ex.nRep} reps</span>` : ''}
                    </div>
                    ${video
                        ? `<button class="ez-video-btn" onclick="event.stopPropagation(); apriVideo('${video}')" title="Guarda video">
                            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </button>`
                        : ''}
                    ${_scheda.tipo !== 'predefinita'
                        ? `<button class="ez-remove-btn" onclick="event.stopPropagation(); rimuoviEsercizioDaScheda(${ex.exerciseId})">Rimuovi</button>`
                        : ''}
                    `;
                lista.appendChild(item);
            });
        }

        /*  RIMUOVI ESERCIZIO DALLA SCHEDA  */
        async function rimuoviEsercizioDaScheda(exerciseId) {
            apriConfermaDettaglio(
                'Rimuovere questo esercizio?',
                "L'esercizio verrà rimosso dalla scheda.",
                async () => {
                    try {
                        const res = await fetch(`${API}/users/workout-plans/${schedaId}/exercises/${exerciseId}`, {
                            method: 'DELETE',
                            headers: { Authorization: 'Bearer ' + TOKEN() }
                        });
                        if (res.ok) caricaScheda();
                    } catch(e) {
                        console.error('Errore rimozione esercizio:', e);
                    }
                }
            );
        }

        /*  AVVIA ALLENAMENTO  */
        function avviaAllenamento() {
            window.location.href = 'allenamento.html?id=' + schedaId + '&tipo=' + tipo;
        }

        /*  ELIMINA SCHEDA  */
        function eliminaScheda() {
            apriConfermaDettaglio(
                'Eliminare questa scheda?',
                'Questa azione è irreversibile. La scheda e tutti i suoi esercizi verranno rimossi.',
                async () => {
                    try {
                        await fetch(`${API}/users/workout-plans/${schedaId}`, {
                            method: 'DELETE',
                            headers: { Authorization: 'Bearer ' + TOKEN() }
                        });
                    } catch(e) {
                        console.error('Errore eliminazione:', e);
                    }
                    window.location.href = 'schede.html';
                }
            );
        }


        /* MODALE MODIFICA SCHEDA */

        let _editEsercizi  = [];
        let _tuttiEsercizi = [];

        async function apriModaleModifica() {
            _editEsercizi = (_scheda?.workout_ex || []).map(ex => ({
                id:   ex.exerciseId,
                nome: ex.exercise?.nameIt || ex.exercise?.name || 'Esercizio',
                nSet: ex.nSet || 3,
                nRep: ex.nRep || 0,
            }));

            document.getElementById('mod-nome').value = _scheda?.name || '';
            document.getElementById('mod-note').value = _scheda?.note || '';
            renderModEzList();

            document.getElementById('modal-modifica').classList.add('open');

            /* carica tutti gli esercizi disponibili se non ancora fatto */
            if (_tuttiEsercizi.length === 0) {
                fetch(`${API}/fullexercises`)
                    .then(r => r.json())
                    .then(data => {
                        _tuttiEsercizi = data.map(d => ({
                            id:    d.id,
                            nome:  d.nameIt,
                            zone:  [d.macroPart, d.bodyPart].filter(Boolean),
                            macro: d.macroPart || '',
                        }));
                    })
                    .catch(e => console.error('Errore caricamento esercizi:', e));
            }
        }

        function chiudiModaleModifica() {
            document.getElementById('modal-modifica').classList.remove('open');
        }

        /*  RENDER LISTA ESERCIZI NEL MODALE con stepper pill  */
        function renderModEzList() {
            const lista = document.getElementById('mod-ez-list');
            if (!lista) return;

            if (_editEsercizi.length === 0) {
                lista.innerHTML = '<div style="font-size:0.75rem; color:var(--muted); text-align:center; padding:12px 0;">Nessun esercizio aggiunto</div>';
                return;
            }

            lista.innerHTML = _editEsercizi.map((ez, i) =>
                '<div style="display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface2); border:0.5px solid var(--border); border-radius:var(--radius);">' +
                    '<div style="flex:1; font-size:0.82rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + ez.nome + '</div>' +
                    '<span style="font-size:0.62rem; color:var(--muted); flex-shrink:0; letter-spacing:0.05em;">Serie</span>' +
                    '<div class="ez-stepper">' +
                        '<button onclick="stepSerie(' + i + ', -1)">−</button>' +
                        '<span id="set-val-' + i + '">' + (ez.nSet || 1) + '</span>' +
                        '<button onclick="stepSerie(' + i + ', 1)">+</button>' +
                    '</div>' +
                    '<span style="font-size:0.62rem; color:var(--muted); flex-shrink:0; letter-spacing:0.05em;">Reps</span>' +
                    '<div class="ez-stepper">' +
                        '<button onclick="stepRep(' + i + ', -1)">−</button>' +
                        '<span id="rep-val-' + i + '">' + (ez.nRep || 0) + '</span>' +
                        '<button onclick="stepRep(' + i + ', 1)">+</button>' +
                    '</div>' +
                    '<button style="font-size:1rem; color:var(--muted); background:none; border:none; cursor:pointer; flex-shrink:0; padding:0 2px; line-height:1; transition:color 0.15s;" ' +
                            'onmouseenter="this.style.color=\'#e24b4a\'" onmouseleave="this.style.color=\'var(--muted)\'" ' +
                            'onclick="rimuoviEditEz(' + i + ')">✕</button>' +
                '</div>'
            ).join('');
        }

        function stepSerie(idx, delta) {
            if (!_editEsercizi[idx]) return;
            _editEsercizi[idx].nSet = Math.max(1, (_editEsercizi[idx].nSet || 1) + delta);
            const el = document.getElementById('set-val-' + idx);
            if (el) el.textContent = _editEsercizi[idx].nSet;
        }

        function stepRep(idx, delta) {
            if (!_editEsercizi[idx]) return;
            _editEsercizi[idx].nRep = Math.max(0, (_editEsercizi[idx].nRep || 0) + delta);
            const el = document.getElementById('rep-val-' + idx);
            if (el) el.textContent = _editEsercizi[idx].nRep;
        }

        function rimuoviEditEz(idx) {
            _editEsercizi.splice(idx, 1);
            renderModEzList();
        }

        async function salvaModifica() {
            const nome = document.getElementById('mod-nome')?.value.trim();
            const note = document.getElementById('mod-note')?.value.trim();
            if (!nome) { document.getElementById('mod-nome')?.focus(); return; }

            try {
                await fetch(`${API}/users/workout-plans/${schedaId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN() },
                    body: JSON.stringify({ name: nome, note })
                });

                await fetch(`${API}/users/workout-plans/${schedaId}/exercises`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN() },
                    body: JSON.stringify({
                        esercizi: _editEsercizi.map(ez => ({
                            exerciseId: ez.id,
                            nSet: ez.nSet,
                            nRep: ez.nRep,
                        }))
                    })
                });

            } catch(e) {
                console.error('Errore salvataggio:', e);
            }

            chiudiModaleModifica();
            caricaScheda();
        }


        /* BOTTOM SHEET: AGGIUNTA ESERCIZI */

        let _sheetCatAttiva = 'Tutti';
        /* set temporaneo degli id toccati nel sheet */
        let _sheetSelezione = new Set();

        function apriSheetEsercizi() {
            /* parte dalla selezione corrente nel modale modifica */
            _sheetSelezione = new Set(_editEsercizi.map(e => e.id));
            _sheetCatAttiva = 'Tutti';

            document.getElementById('sheet-search').value = '';
            renderSheetCats();
            renderSheetEzList();
            document.getElementById('modal-aggiungi-ez').classList.add('open');
        }

        function chiudiSheetEsercizi() {
            document.getElementById('modal-aggiungi-ez').classList.remove('open');
        }

        function confermaSheetEsercizi() {
            /* aggiunge i nuovi selezionati */
            _sheetSelezione.forEach(id => {
                if (!_editEsercizi.find(e => e.id === id)) {
                    const ez = _tuttiEsercizi.find(e => e.id === id);
                    if (ez) _editEsercizi.push({ id: ez.id, nome: ez.nome, nSet: 3, nRep: 0 });
                }
            });
            /* rimuove quelli deselezionati */
            _editEsercizi = _editEsercizi.filter(e => _sheetSelezione.has(e.id));

            renderModEzList();
            chiudiSheetEsercizi();
        }

        function renderSheetCats() {
            const cats = document.getElementById('sheet-cats');
            if (!cats) return;
            const gruppi = ['Tutti', ...new Set(_tuttiEsercizi.map(e => e.macro).filter(Boolean))];
            cats.innerHTML = gruppi.map(g =>
                '<button class="sheet-cat' + (g === _sheetCatAttiva ? ' active' : '') + '" onclick="selezionaCat(\'' + g + '\')">' +
                    g.charAt(0).toUpperCase() + g.slice(1) +
                '</button>'
            ).join('');
        }

        function selezionaCat(cat) {
            _sheetCatAttiva = cat;
            renderSheetCats();
            renderSheetEzList();
        }

        function filtroSheetEz() {
            renderSheetEzList();
        }

        function renderSheetEzList() {
            const lista = document.getElementById('sheet-ez-list');
            const query = (document.getElementById('sheet-search')?.value || '').toLowerCase().trim();
            if (!lista) return;

            const filtrati = _tuttiEsercizi.filter(ez => {
                const corrisponde = !query || ez.nome.toLowerCase().includes(query);
                const nelGruppo  = _sheetCatAttiva === 'Tutti' || ez.macro === _sheetCatAttiva;
                return corrisponde && nelGruppo;
            }).slice(0, 50);

            if (filtrati.length === 0) {
                lista.innerHTML = '<div class="sheet-empty">Nessun esercizio trovato</div>';
                return;
            }

            lista.innerHTML = filtrati.map(ez => {
                const sel = _sheetSelezione.has(ez.id);
                return '<div class="sheet-ez-item">' +
                    '<div class="sheet-ez-info">' +
                        '<div class="sheet-ez-nm">' + ez.nome + '</div>' +
                        '<div class="sheet-ez-zone">' + (ez.zone || []).join(' · ') + '</div>' +
                    '</div>' +
                    '<button class="sheet-add-btn' + (sel ? ' aggiunto' : '') + '" ' +
                            'id="sheet-btn-' + ez.id + '" ' +
                            'onclick="toggleSheetEz(' + ez.id + ')">' +
                        (sel ? '✓ Aggiunto' : '+ Add') +
                    '</button>' +
                '</div>';
            }).join('');
        }

        function toggleSheetEz(id) {
            if (_sheetSelezione.has(id)) {
                _sheetSelezione.delete(id);
            } else {
                _sheetSelezione.add(id);
            }
            /* aggiorna solo il bottone cliccato senza re-renderizzare tutta la lista */
            const btn = document.getElementById('sheet-btn-' + id);
            if (btn) {
                const ora = _sheetSelezione.has(id);
                btn.textContent = ora ? '✓ Aggiunto' : '+ Add';
                btn.classList.toggle('aggiunto', ora);
            }
        }

        function apriVideo(url) {
            document.getElementById('video-player').src = url;
            document.getElementById('modal-video').classList.add('open');
        }

        function chiudiVideo() {
            const v = document.getElementById('video-player');
            v.pause();
            v.src = '';
            document.getElementById('modal-video').classList.remove('open');
        }

        /* chiudi i modali cliccando sull'overlay */
        document.getElementById('modal-modifica').addEventListener('click', function(e) {
            if (e.target === this) chiudiModaleModifica();
        });
        document.getElementById('modal-aggiungi-ez').addEventListener('click', function(e) {
            if (e.target === this) chiudiSheetEsercizi();
        });
        document.getElementById('modal-video').addEventListener('click', function(e) {
            if (e.target === this) chiudiVideo();
        });

        async function salvaAllenamento(){
            const id_scheda = parseInt(params.get('id'))

            const res = await fetch(`${API}/users/workout-template/${schedaId}`, {
                method : 'POST',
                headers : {
                    'Content-Type' : 'application/json',
                    'Authorization' : 'Bearer ' + TOKEN()
                }
            })

            const data = res.json()
            if(res) {
                window.location.href = 'schede.html'
            }
        }

        /* MODALE CONFERMA DETTAGLIO */
        let _callbackDettaglio = null;

        function apriConfermaDettaglio(title, sub, callback) {
            document.getElementById('conferma-dettaglio-title').textContent = title;
            document.getElementById('conferma-dettaglio-sub').textContent   = sub;
            _callbackDettaglio = callback;
            document.getElementById('modal-conferma-dettaglio').classList.add('open');
        }

        function chiudiConfermaDettaglio() {
            _callbackDettaglio = null;
            document.getElementById('modal-conferma-dettaglio').classList.remove('open');
        }

        function confermaDettaglio() {
            const cb = _callbackDettaglio;
            chiudiConfermaDettaglio();
            if (cb) cb();
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('modal-conferma-dettaglio').addEventListener('click', function(e) {
                if (e.target === this) chiudiConfermaDettaglio();
            });
        });

        /*  START  */
        caricaScheda();
    </script>

    <!-- MODALE CONFERMA DETTAGLIO -->
    <div class="modal-overlay" id="modal-conferma-dettaglio">
        <div class="annulla-box">
            <div class="annulla-title" id="conferma-dettaglio-title">Conferma</div>
            <div class="annulla-sub" id="conferma-dettaglio-sub"></div>
            <div class="annulla-btns">
                <button class="annulla-continua" onclick="chiudiConfermaDettaglio()">Annulla</button>
                <button class="annulla-conferma" onclick="confermaDettaglio()">Elimina</button>
            </div>
        </div>
    </div>

</body>
</html>
