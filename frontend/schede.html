<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBro - Schede</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon/Favicon32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="stili.css">
    <script src="funzioni.js"></script>

    <style>
        /* Stili specifici pagina schede*/
        .page-content { max-width: 1200px;
        margin: 0 auto;
        }
        

        /* griglia schede*/
        .schede-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        /* card singola scheda*/
        .scheda-card{
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: border-color 0.18s, background 0.18s;
        }

        .scheda-card:hover{
            border-color: var(--accent);
            background: var(--surface2);
        }

        .scheda-card.predefinita{ opacity: 0.78;}
        .scheda-card.predefinita:hover{ opacity: 1;}

        .scheda-name{
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 4px;
        }

        .scheda-meta{
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .scheda-tags{
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .scheda-footer{
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 0.5px solid var(--border);
        }

        .scheda-data{
            font-size: 0.65rem;
            color: var(--muted);
        }

        .scheda-actions{ 
            display: flex;
            gap: 8px;
        }

        .scheda-btn{
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 3px 8px;
            cursor: pointer;
            background: none;
            transition: color 0.18s border-color 0.18s;
        }

        .scheda-btn:hover{
            color: var(--accent);
            border-color: var(--accent);
        }
        .scheda-btn.danger:hover{
            color: #e24b4a;
            border-color: #e24b4a;
        }

        /* card "Crea nuova": occupa una cella della griglia*/
        .new-scheda-card{
            background:      transparent;
            border:          0.5px dashed var(--border);
            border-radius:   var(--radius);
            padding:         16px;
            cursor:          pointer;
            display:         flex;
            align-items:     center;
            justify-content: center;
            min-height:      100px;
            color:           var(--muted);
            font-size:       0.72rem;
            font-weight:     500;
            letter-spacing:  0.1em;
            text-transform:  uppercase;
            transition:      border-color 0.18s, color 0.18s;
        }

        .new-scheda-card:hover{
            border-color: var(--accent);
            color: var(--accent);
        }

        /* modifica inline scheda */
        .scheda-edit-panel { display:none; flex-direction:column; gap:12px; padding:14px; border-top:0.5px solid var(--border); background:var(--surface2); }
        .scheda-edit-panel.open { display:flex; }
        .edit-section-title { font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
        .edit-input { width:100%; padding:8px 10px; border-radius:var(--radius); border:0.5px solid var(--border); background:var(--surface); color:var(--text); font-family:var(--font-body); font-size:0.82rem; outline:none; transition:border-color 0.18s; }
        .edit-input:focus { border-color:var(--accent); }
        .edit-ez-list { display:flex; flex-direction:column; gap:6px; }
        .edit-ez-row { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); }
        .edit-ez-name { flex:1; font-size:0.78rem; color:var(--text); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .edit-ez-input { width:48px; padding:4px 6px; text-align:center; border-radius:4px; border:0.5px solid var(--border); background:var(--surface2); color:var(--text); font-family:var(--font-body); font-size:0.78rem; outline:none; }
        .edit-ez-input:focus { border-color:var(--accent); }
        .edit-ez-input-lbl { font-size:0.62rem; color:var(--muted); flex-shrink:0; }
        .edit-ez-remove { font-size:0.85rem; color:var(--muted); background:none; border:none; cursor:pointer; flex-shrink:0; }
        .edit-ez-remove:hover { color:#e24b4a; }
        .edit-search-wrap { display:flex; flex-direction:column; gap:6px; }
        .edit-search-input { width:100%; padding:7px 10px; border-radius:var(--radius); border:0.5px solid var(--border); background:var(--surface); color:var(--text); font-family:var(--font-body); font-size:0.82rem; outline:none; }
        .edit-search-input:focus { border-color:var(--accent); }
        .edit-search-results { display:flex; flex-direction:column; gap:4px; max-height:140px; overflow-y:auto; }
        .edit-result-row { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); }
        .edit-result-name { font-size:0.78rem; color:var(--text); }
        .edit-result-zona { font-size:0.65rem; color:var(--muted); margin-top:2px; }
        .edit-add-btn { font-size:0.65rem; color:var(--accent); border:0.5px solid var(--accent-dim); border-radius:4px; padding:3px 8px; background:none; cursor:pointer; white-space:nowrap; }
        .edit-footer { display:flex; gap:8px; }

        /* stato vuoto*/
        .empty-state{
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 0.82rem;
            border: 0.5px dashed var(--border);
            border-radius: var(--radius);
            grid-column:   1 / -1;
        }

        .empty-state p{
            margin-bottom: 16px;
        }

        /*  MODALE CREA SCHEDA  */
        .crea-modal {
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .crea-modal .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-label {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .form-input {
            width: 100%; padding: 9px 12px;
            border-radius: var(--radius); border: 0.5px solid var(--border);
            background: var(--surface2); color: var(--text);
            font-family: var(--font-body); font-size: 0.85rem;
            outline: none; transition: border-color 0.18s;
        }

        .form-input:focus { border-color: var(--accent); }

        /* ricerca esercizi */
        .search-row { display: flex; gap: 8px; }

        .search-input {
            flex: 1; padding: 8px 12px;
            border-radius: var(--radius); border: 0.5px solid var(--border);
            background: var(--surface2); color: var(--text);
            font-family: var(--font-body); font-size: 0.82rem;
            outline: none; transition: border-color 0.18s;
        }

        .search-input:focus { border-color: var(--accent); }

        .crea-chips { display: flex; gap: 6px; flex-wrap: wrap; }

        /* lista risultati */
        .ez-results {
            display: flex; flex-direction: column; gap: 4px;
            max-height: 140px; overflow-y: auto;
        }

        .ez-result-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; background: var(--surface2);
            border: 0.5px solid var(--border); border-radius: var(--radius);
            transition: border-color 0.18s;
        }

        .ez-result-row:hover { border-color: var(--accent); }

        .ez-result-name { font-size: 0.82rem; color: var(--text); }
        .ez-result-zona { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

        .ez-add-btn {
            font-size: 0.68rem; font-weight: 500; letter-spacing: 0.06em;
            color: var(--accent); border: 0.5px solid var(--accent-dim);
            border-radius: var(--radius); padding: 4px 10px;
            background: none; cursor: pointer; white-space: nowrap;
            transition: background 0.18s;
        }

        .ez-add-btn:hover { background: var(--accent-dim); }

        .ez-no-results {
            font-size: 0.75rem; color: var(--muted);
            text-align: center; padding: 12px 0;
        }

        /* separatore */
        .crea-sep {
            height: 0.5px; background: var(--border); flex-shrink: 0;
        }

        /* lista esercizi aggiunti */
        .added-header {
            display: flex; align-items: center; justify-content: space-between;
        }

        .added-title {
            font-size: 0.65rem; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
        }

        .added-count {
            font-size: 0.68rem; color: var(--accent);
            font-weight: 500;
        }

        .added-list {
            display: flex; flex-direction: column; gap: 4px;
            max-height: 160px; overflow-y: auto;
        }

        .added-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 7px 10px; background: var(--accent-dim);
            border: 0.5px solid var(--accent-dim); border-radius: var(--radius);
        }

        .added-name { font-size: 0.82rem; color: var(--text); }
        .added-zona { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

        .remove-btn {
            font-size: 0.9rem; color: var(--muted);
            background: none; border: none; cursor: pointer;
            transition: color 0.18s; padding: 0 2px;
        }

        .feedback-toast {
            position:      fixed;
            bottom:        80px;
            left:          50%;
            transform:     translateX(-50%) translateY(20px);
            background:    var(--surface);
            border:        0.5px solid var(--accent);
            border-radius: var(--radius);
            padding:       10px 20px;
            font-size:     0.8rem;
            color:         var(--text);
            z-index:       9999;
            opacity:       0;
            transition:    opacity 0.2s ease, transform 0.2s ease;
            white-space:   nowrap;
        }

        .feedback-toast.show {
            opacity:   1;
            transform: translateX(-50%) translateY(0);
        }      

        .remove-btn:hover { color: #e24b4a; }

        .added-empty {
            font-size: 0.75rem; color: var(--border);
            text-align: center; padding: 10px;
            border: 0.5px dashed var(--border); border-radius: var(--radius);
        }

        @media (max-width: 600px){
            .schede-grid{ grid-template-columns: 1fr;}
        }
    </style>
</head>

    <nav class="sidebar" id="sidebar">

    <!-- CONTENUTO -->
    <div class="page-layout">

            <div class="section">

                    <a href="statistiche.html" class="btn-ghost" style="text-decoration:none; display:flex; align-items:center; gap:5px; padding:5px 12px; font-size:0.72rem;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>

                    </a>

                <!-- filtri zona-->
                <div class="chips-row" id="filtri-personali" style="margin-bottom: 16px;">
                    <button class="chip active" onclick="filtraSchede('tutte', 'personali', this)">Tutte</button>

                    <button class="chip" onclick="filtraSchede('petto', 'personali', this)">Petto</button>
                    <button class="chip" onclick="filtraSchede('braccia', 'personali', this)">Braccia</button>
                    <button class="chip" onclick="filtraSchede('spalle', 'personali', this)">Spalle</button>
                    <button class="chip" onclick="filtraSchede('addome', 'personali', this)">Addome</button>
                    <button class="chip" onclick="filtraSchede('glutei', 'personali', this)">Glutei</button>

                <div class="schede-grid" id="grid-schede-personali">

            <div class="section">

                <div class="chips-row" id="filtri-predefinite" style="margin-bottom: 16px;">
                    <button class="chip active" onclick="filtraSchede('tutte', 'predefinite', this)">Tutte</button>
                    <button class="chip" onclick="filtraSchede('Principiante', 'predefinite', this)">Principiante</button>
                    <button class="chip" onclick="filtraSchede('Intermedio', 'predefinite', this)">Intermedio</button>

    <nav class="bottom-nav">

    </nav>

    <!-- MODALE CREA SCHEDA -->
    <div class="modal-overlay" id="modal-crea-scheda">
        <div class="modal crea-modal">

            <div class="modal-header">
                <div>
                    <div class="modal-title">Crea nuova scheda</div>
                    <div class="modal-sub">Dai un nome e aggiungi gli esercizi che vuoi</div>
                </div>
                <button class="modal-close" onclick="chiudiCreaScheda()">✕</button>
            </div>

            <div class="modal-body">

                <!-- nome -->
                <div class="form-row">
                    <label class="form-label" for="input-nome-scheda">Nome scheda *</label>
                    <input class="form-input" type="text" id="input-nome-scheda"
                           placeholder="Es. Push Pull Legs">
                </div>

                

            <div class="modal-footer">
                <button class="btn-ghost" onclick="chiudiCreaScheda()">Annulla</button>
                <button class="btn-primary" onclick="salvaSchedaNuova()">Salva scheda</button>
            </div>

        </div>

    

    <div class="feedback-toast" id="feedback-toast"></div>

    <script>
    

        const API   = 'http://localhost:3000';
        /* FILTRI */
        function filtraSchede(zona, tipo, btn) {
            const grid     = document.getElementById('grid-schede-' + tipo);
            const filtriEl = document.getElementById('filtri-' + tipo);
            const tutteBtn = filtriEl.querySelector('.chip:first-child');

            /* se premi il chip già attivo, torna a "Tutte" */
            if (btn.classList.contains('active') && zona !== 'tutte') {
                filtriEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                tutteBtn.classList.add('active');
                zona = 'tutte';
            } else {
                filtriEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            if(tipo === 'predefinite'){
                grid.querySelectorAll('.scheda-card').forEach(card => {
                if (zona === 'tutte') {
                    card.style.display = 'block';
                } else {
                    if(card.dataset.livello === zona){
                        card.style.display = 'block';
                    }else{
                        card.style.display = 'none';
                    }
                }
                });
                
            }else{
                grid.querySelectorAll('.scheda-card').forEach(card => {
                if (zona === 'tutte') {
                    card.style.display = 'block';
                } else {
                    const zone = card.dataset.zone ? card.dataset.zone.split(',') : [];
                    card.style.display = zone.includes(zona) ? 'block' : 'none';
                }
                });
            }
        
        
        }

        /* creaCardScheda(scheda)*/
        function creaCardScheda(scheda){
            const card= document.createElement('div');
            card.className= 'scheda-card' + (scheda.tipo === 'predefinita' ? ' predefinita' : '');
            card.dataset.zone= scheda.zone.join(',');
            card.dataset.id= scheda.id;
            card.dataset.livello = scheda.livello;

            const tags= scheda.zone.map(z => `<span class= "tag">${z}</span>`).join('');
            const livelloBadge= scheda.livello ? `<span class="tag">${scheda.livello}</span>`: '';

            const azioni= scheda.tipo === 'Personale' ?
                `<div class="scheda-actions">
                </div>`
                : `<div class="scheda-actions">
                </div>`;
            card.innerHTML=
                `<div class="scheda-name">${scheda.nome} ${livelloBadge}</div>
                <div class="scheda-meta">${scheda.esercizi} esercizi </div>
                <div class="scheda-tags">${tags}</div>
                <span class="scheda-data">${scheda.data || ''}</span>
                <div class="scheda-footer">
                    ${azioni}
                </div>
                <div class="scheda-edit-panel" id="edit-panel-${scheda.id}"></div>`;
            card.addEventListener('click', () => {
                window.location.href= 'dettaglio.html?id=' + scheda.id + '&tipo=' + scheda.tipo;
            });
            return card;
        }

        /* AZIONI SCHEDE*/
        let _editEsercizi = {};

        let _callbackConferma = null;
        
        /*  MODALE CREA SCHEDA  */
        let _tuttiEsercizi  = [];  
        let _aggiunti       = [];  /* esercizi aggiunti alla scheda in costruzione */
        let _zonaFiltro     = 'tutte';

        function mostraFeedback(messaggio) {
            const toast = document.getElementById('feedback-toast');
            toast.textContent = messaggio;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        

        async function apriCreaScheda() {
            const logged =  checkLogged()
            if(!logged){
                return;
            }
            _aggiunti = [];
            document.getElementById('input-nome-scheda').value = '';
            document.getElementById('modal-crea-scheda').classList.add('open');
            
               
        }
        
        function chiudiCreaScheda() {
            document.getElementById('modal-crea-scheda').classList.remove('open');
        }

        document.getElementById('modal-crea-scheda').addEventListener('click', function(e) {
            if (e.target === this) chiudiCreaScheda();
        });

        
        

        /* salva la scheda */
        async function salvaSchedaNuova() {
            const nome = document.getElementById('input-nome-scheda').value.trim();

            if (!nome) {
                document.getElementById('input-nome-scheda').focus();
                document.getElementById('input-nome-scheda').style.borderColor = '#e24b4a';
                return;
            }

            document.getElementById('input-nome-scheda').style.borderColor = '';

            const token = localStorage.getItem('gymbros-token');

            try {
                const data_create = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' })
                const response = await fetch(`${API}/workout-plans`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nome : nome,
                        tipo : 'Personale',
                        data : data_create,
                     })
                });

                if (!response.ok) {
                    const err = await response.json();
                    console.error('Errore creazione scheda:', err);
                    return;
                }

                const nuovaScheda = await response.json();

                /* aggiunge la card alla griglia senza ricaricare la pagina */
                const grid    = document.getElementById('grid-schede-personali');
                const newCard = document.getElementById('new-scheda-card');
                document.getElementById('empty-personali')?.remove();

                const cardDati = {
                    id:       nuovaScheda.workoutId,
                    nome:     nuovaScheda.name,
                    esercizi: 0,
                    giorni:   0,
                    zone:     [],
                    data:     data_create,
                    tipo:     'Personale',
                    livello:  null
                };

                grid.insertBefore(creaCardScheda(cardDati), newCard);
                chiudiCreaScheda();

            } catch (e) {
                console.error('Errore di rete:', e);
            }
        }

        async function loadSchede(){
            const logged = checkLogged()
            if(!logged){
                return true;
            }
            const response = await fetch(`${API}/users/workout-plans`, {
                method : 'GET',
                headers : {
                    'Authorization' : 'Bearer ' + localStorage.getItem('gymbros-token'),
                    'Application' : 'application/json'
                }
            })

            const data = await response.json()
            
            document.getElementById('empty-personali').remove()
            data.forEach(scheda =>{
                workout = {
                    id:       scheda.workoutId,
                    nome:     scheda.name,
                    esercizi: scheda._count.workout_ex,
                    giorni:   0,
                    zone:     scheda.zone ?? [],
                    data:     scheda.dataCreazione ? new Date(scheda.dataCreazione).toLocaleDateString('it-IT') : '',
                    tipo:     scheda.tipo,
                    livello:  scheda.livello
                }

                document.getElementById('grid-schede-personali').append(creaCardScheda(workout))
               
            })

            //CARICA SCHEDE PREDEFINITE
            const res = await fetch(`${API}/users/workout-template`, {
                method : 'GET',
                headers : {
                    'Authorization' : 'Bearer ' + localStorage.getItem('gymbros-token'),
                    'Application' : 'application/json'
                }
            })

            const predef = await res.json()
            document.getElementById('empty-predefinite').remove()
            predef.forEach(scheda =>{
                workout = {
                    id:       scheda.templateId,
                    nome:     scheda.name,
                    esercizi: scheda._count.template_ex,
                    giorni:   0,
                    zone:     scheda.zone ?? [],
                    data:     scheda.dataCreazione ? new Date(scheda.dataCreazione).toLocaleDateString('it-IT') : '',
                    tipo:     scheda.tipo,
                    livello:  scheda.livello
                }

                document.getElementById('grid-schede-predefinite').append(creaCardScheda(workout))
                
            })

        }

        loadSchede()
    </script>
</body>
</html>
